# Smoke: Laya typed-decisions FT recipe adapted to medical data (~1h on T4×2).
# Diff vs configs/smoke.yaml (pure RLCD): CE×1.0, sph=0.75, soft teacher targets, batch adv std.
model_id: convaiinnovations/laya
max_len: 512
head_max_len: 192

train:
  medmcqa_n: 4000
  mednli_n: 1000
  seed: 20260923
  epochs: 1
  micro_batch: 8
  grad_accum: 4
  group_size: 4
  lr_encoder: 2.5e-5
  lr_head: 1.0e-4
  sigma_start: 0.4
  sigma_end: 0.1
  ce_weight: 1.0          # Laya FT notebook: RLCD + full soft CE
  sph_weight: 0.75        # Laya FT notebook
  rps_weight: 1.0
  adv_normalize: batch    # Laya notebook: one std over G×batch (not per-question)
  max_tokens_per_batch: 4096
  calib_max: 400
  shuffle_options: true
  soft_targets:
    enabled: true
    mix: 0.5              # target = (1-mix)*onehot + mix*base_laya_softmax
                          # (no gold soft labels on MedMCQA; blend keeps hard gold signal)

eval:
  generic_n_per_task: 400
  medical_n_per_task: 400
  generic_tasks: [ag_news, emotion]
  medical_tasks: [pubmedqa, medqa]
