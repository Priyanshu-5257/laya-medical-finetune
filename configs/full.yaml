# Full-data medical FT on Kaggle 2×T4: full MedMCQA (~183k) + full MedNLI (~11k), 5 epochs.
# Rough wall-clock: ~30–40h+ on T4×2 for ~194k × 5 — expect multi-session; dataset is full.
# Set medmcqa_n / mednli_n to -1 for "all rows" (see prepare_data._cap_reached).
model_id: convaiinnovations/laya
max_len: 512
head_max_len: 192

wandb:
  enabled: true
  project: laya-medical
  name: full-ft-fulldata-e5
  # entity: optional

train:
  medmcqa_n: -1          # full openlifescienceai/medmcqa train (~182822)
  mednli_n: -1           # full araag2/MedNLI train (~11232)
  seed: 20260923
  epochs: 5
  micro_batch: 8
  grad_accum: 4
  group_size: 4
  lr_encoder: 2.5e-5
  lr_head: 1.0e-4
  sigma_start: 0.4
  sigma_end: 0.1
  ce_weight: 0.0
  sph_weight: 0.5
  rps_weight: 1.0
  max_tokens_per_batch: 4096
  calib_max: 2000
  shuffle_options: true
  log_every: 25
  eval_every_epoch: true

eval:
  generic_n_per_task: 400
  medical_n_per_task: 400
  generic_tasks: [ag_news, emotion]
  medical_tasks: [pubmedqa, medqa]
