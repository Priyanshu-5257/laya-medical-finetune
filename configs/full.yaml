# Longer full fine-tune on Kaggle 2×T4 (~30k Q × 10 epochs + per-epoch dual eval)
# Wall-clock: expect ~15–20h on T4×2 — may need a long session / reattach; dataset is NOT the limit
# (MedMCQA train has ~183k rows; we subsample ~30k and pass over it 10×).
model_id: convaiinnovations/laya
max_len: 512
head_max_len: 192

wandb:
  enabled: true
  project: laya-medical
  name: full-ft-v1
  # entity: optional

train:
  medmcqa_n: 24000
  mednli_n: 6000
  seed: 20260923
  epochs: 10
  micro_batch: 8
  grad_accum: 4
  group_size: 4
  lr_encoder: 2.5e-5
  lr_head: 1.0e-4
  sigma_start: 0.4
  sigma_end: 0.1
  ce_weight: 0.0
  sph_weight: 0.5
  rps_weight: 1.0
  max_tokens_per_batch: 4096
  calib_max: 800
  shuffle_options: true
  log_every: 25
  eval_every_epoch: true

eval:
  generic_n_per_task: 400
  medical_n_per_task: 400
  generic_tasks: [ag_news, emotion]
  medical_tasks: [pubmedqa, medqa]
