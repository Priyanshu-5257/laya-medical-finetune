# ~1h medical smoke fine-tune on Kaggle 2xT4 (keep max_len=512)
model_id: convaiinnovations/laya
max_len: 512
head_max_len: 192

train:
  medmcqa_n: 4000
  mednli_n: 1000
  seed: 20260923
  epochs: 1
  micro_batch: 8
  grad_accum: 4
  group_size: 4
  lr_encoder: 2.5e-5
  lr_head: 1.0e-4
  sigma_start: 0.4
  sigma_end: 0.1
  ce_weight: 0.0          # pure RLCD for smoke; raise later if needed
  sph_weight: 0.5
  rps_weight: 1.0
  max_tokens_per_batch: 4096
  calib_max: 400
  shuffle_options: true

eval:
  generic_n_per_task: 400
  medical_n_per_task: 400
  # train uses MedMCQA + MedNLI; eval medical uses different datasets
  generic_tasks: [ag_news, emotion]
  medical_tasks: [pubmedqa, medqa]
