# Controlled comparison from the same aligned BioClinical checkpoint.
model_id: convaiinnovations/laya
max_len: 512
head_max_len: 192

train:
  medmcqa_n: 4000
  mednli_n: 1000
  seed: 20260923
  epochs: 3
  micro_batch: 8
  grad_accum: 4
  group_size: 4
  lr_encoder: 5.0e-6
  lr_head: 1.0e-4
  sigma_start: 0.4
  sigma_end: 0.1
  ce_weight: 0.0
  rlcd_weight: 1.0
  sph_weight: 0.75
  rps_weight: 1.0
  adv_normalize: batch
  max_tokens_per_batch: 4096
  calib_max: 400
  shuffle_options: true
  log_every: 25
  eval_every_epoch: true
  save_rolling_checkpoint: false
  soft_targets:
    enabled: false

eval:
  generic_n_per_task: 400
  medical_n_per_task: 400
  generic_tasks: [ag_news, emotion]
  medical_tasks: [pubmedqa, medqa]
